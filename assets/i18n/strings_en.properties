tip.label=TIP
tip.1=Your flashlight can help you deal with some threats: switching it on and off at them has an effect.
tip.2=Listen carefully: some animatronics give themselves away before you can see them.
tip.3=To use doors and objects, aim with the crosshair and press E.
tip.4=Holding SHIFT makes you run. It helps you escape, but it is harder to control in tight corridors.
tip.5=If you get caught you lose a life... and whatever you were carrying.
tip.6=When your heartbeat speeds up, danger is close.
tip.7=Scenes can be skipped by holding ESC.
