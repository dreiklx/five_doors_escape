tip.label=CONSEJO
tip.1=La linterna puede ayudarte a controlar algunas amenazas: encenderla y apagarla sobre ellas tiene efecto.
tip.2=Escucha con atencion: algunos animatronicos se delatan antes de que puedas verlos.
tip.3=Para usar puertas y objetos, apunta con la mira y presiona E.
tip.4=Mantener SHIFT te hace correr. Sirve para escapar, pero en los pasillos cuesta mas controlar el movimiento.
tip.5=Si te atrapan pierdes una vida... y lo que llevabas encima.
tip.6=Cuando los latidos se aceleran, el peligro esta cerca.
tip.7=Las escenas se pueden omitir manteniendo ESC.
